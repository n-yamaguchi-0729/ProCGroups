name: Cache download instructions

on:
  workflow_run:
    workflows: [Lean, Verify Sawin theorem]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.event.repository.private == false &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out current trusted instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/cache-notes.py
          sparse-checkout-cone-mode: false
      - name: Update download instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/cache-notes.py update
