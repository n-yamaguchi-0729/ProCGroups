name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reject proof escapes and warning suppression
        shell: bash
        run: |
          if rg -n '^\s*(set_option|sorry|admit)\b' Lean4; then
            echo "Prohibited Lean command found." >&2
            exit 1
          fi
      - name: Build ProCGroups with warnings as errors
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "true"
          build-args: "--wfail ProCGroups"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Check whitespace
        run: git diff-tree --check --root -r HEAD
