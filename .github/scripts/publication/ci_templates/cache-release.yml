name: Distribute verified Lean cache

on:
  workflow_call:
    inputs:
      cache-kind:
        type: string
        required: false
        default: modern
      cache-prefix:
        type: string
        required: false
        default: nyll-proof-v1

permissions:
  contents: read

jobs:
  release:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned compiler without building
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Restore this run's complete modern cache
        if: inputs.cache-kind == 'modern'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib
            .lake/build/bin
            .lake/build/ir/**/*.c
            .lake/build/ir/**/*.c.hash
            .lake/build/ir/**/*.bc
            .lake/build/ir/**/*.bc.hash
            .lake/build/ir/**/*.o
            .lake/build/ir/**/*.o.*
          key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-all
          fail-on-cache-miss: true
      - name: Restore this run's complete legacy cache
        if: inputs.cache-kind == 'legacy'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean
            .lake/build/ir/**/*.c
            .lake/build/ir/**/*.c.hash
            .lake/build/ir/**/*.bc
            .lake/build/ir/**/*.bc.hash
            ${{ runner.temp }}/project-build-cache.json
          key: lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-library-EntryPoint-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Export source-matched proof files and checksums
        env:
          CACHE_KIND: ${{ inputs.cache-kind }}
        run: |
          set -euo pipefail
          [[ "$CACHE_KIND" == modern || "$CACHE_KIND" == legacy ]]
          python3 -B .github/scripts/cache-export.py package --directory "$RUNNER_TEMP/cache-release"
      - name: Publish a commit-addressed cache release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="cache-${GITHUB_SHA}-linux-x86_64"
          export_dir="$RUNNER_TEMP/cache-release"
          export CACHE_RELEASE_TAG="$tag"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['CACHE_RELEASE_TAG']
          notes = f'''Compiler outputs from successful Lean and proof-verification jobs for `{sha}`.

          Producer: Linux x86_64. Source, toolchain, dependency and artifact SHA-256 hashes are in `cache-manifest.json`. Native objects, dependencies and temporary setup files are excluded. Cross-platform compatibility is not claimed.

          In a clean checkout of this exact commit, install its pinned Lean and dependency versions, then run:

          ```sh
          lake exe cache get
          gh release download {tag} -R {repo} -D tmp/proof-cache-{sha[:12]}
          python3 -B .github/scripts/cache-export.py restore --directory tmp/proof-cache-{sha[:12]}
          ```

          `lake exe cache get` obtains the official Mathlib cache for the pinned dependency manifest; do not run `lake update`. Mathlib is not duplicated in these archives.

          Restore validates source/configuration/platform and all archive contents before writing missing files. Different existing outputs are preserved and reported; do not overwrite active build outputs. Run the normal incremental Lake build afterward. No recompilation was performed to create this archive.
          '''
          (Path(os.environ['RUNNER_TEMP']) / 'cache-release-notes.md').write_text(notes)
          PY
          if gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            if python3 -c 'import json,sys; sys.exit(json.load(open(sys.argv[1]))["isDraft"])' "$RUNNER_TEMP/existing-release.json"; then
              gh release download "$tag" --pattern cache-manifest.json --dir "$RUNNER_TEMP/existing-cache"
              python3 - "$RUNNER_TEMP/existing-cache/cache-manifest.json" "$export_dir/cache-manifest.json" <<'PY'
          import json, sys
          old, new = (json.load(open(path)) for path in sys.argv[1:])
          for key in ('schema', 'commit', 'producer', 'sources', 'configuration'):
              if old[key] != new[key]:
                  raise SystemExit('Existing immutable release does not match this cache: ' + key)
          print('Matching immutable cache release already exists; preserved unchanged.')
          PY
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --latest=false \
              --title "Lean proof cache ${GITHUB_SHA:0:12} (Linux x86_64)" \
              --notes-file "$RUNNER_TEMP/cache-release-notes.md"
          fi
          gh release upload "$tag" "$export_dir"/* --clobber
          gh release edit "$tag" --draft=false --latest=false
