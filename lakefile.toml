name = "ProCGroups"
version = "3.0.0"
defaultTargets = ["ProCGroups.All"]
enableArtifactCache = false
restoreAllArtifacts = false

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
